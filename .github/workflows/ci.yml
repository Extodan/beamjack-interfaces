name: ci
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install OpenSCAD
        run: sudo apt-get update && sudo apt-get install -y openscad python3-pip
      - name: Install trimesh
        run: pip3 install --user trimesh shapely
      - name: Generated consts are fresh
        run: node scripts/gen-consts.mjs --check
      - name: Verify all interfaces (regression check)
        run: node scripts/verify.mjs --check
      - name: Upload verification reports
        uses: actions/upload-artifact@v4
        with:
          name: interface-reports
          path: reports/*.json
